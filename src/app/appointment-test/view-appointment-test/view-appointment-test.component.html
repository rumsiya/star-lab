<app-navbar></app-navbar>
<app-appointment-details [appointment]="appointment"></app-appointment-details>
<table mat-table class="mat-elavation-z8 w-full ml-2" [dataSource]="dataSource">
  <ng-container matColumnDef="no">
    <th mat-header-cell *matHeaderCellDef>No</th>
    <td mat-cell *matCellDef="let row;let i=index">{{ i+1 }}</td>
  </ng-container>
  <ng-container matColumnDef="test_name">
    <th mat-header-cell *matHeaderCellDef>Test Name</th>
    <td mat-cell *matCellDef="let row">{{ row.get_test.test_name }}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let row">{{ row.get_status.status }}</td>
  </ng-container>
  <ng-container matColumnDef="staff">
    <th mat-header-cell *matHeaderCellDef>Staff Name</th>
    <td mat-cell *matCellDef="let row">{{ row.get_staff? row.get_staff.username:'Not mentioned' }}</td>
  </ng-container>


   <ng-conatiner matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let row;let i=index" class="space-x-2">
      <button type="button" *ngIf="!generate[i]" (click)="generateReport(row,i)"  class="w-[150px] text-white p-2 bg-yellow-500 shadow rounded">Generate Report</button>
      <div *ngIf="generate[i]" class="w-[150px] text-white p-2 bg-green-700 shadow rounded"><i class="fa fa-check mr-2"></i>Report Generated</div>

    </td>

  </ng-conatiner>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row;columns:displayedColumns"></tr>
</table>
