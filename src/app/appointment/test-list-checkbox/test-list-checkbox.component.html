<div class="flex justify-center p-2 bg-blue-200 shadow rounded w-full">
  <div class="flex flex-col w-full">
    <div class="flex w-full justify-center">
       <h1 class="font-mono">Select Test</h1>
    </div>
    <div class="grid grid-cols-2 gap-2 w-full justify-center">
      <div *ngFor="let t of test$ |async" class="flex items-center gap-2">
          <input type="checkbox" name="" id="" [value]="t.id" [checked]="isChecked(t.id)"  (change)="onTestChecked($event,t)"> {{t.test_name}}
      </div>
    </div>
    <div class="flex w-full justify-center">
      <button type="button" class="w-full p-2 shadow rounded bg-blue-400 text-white mt-2" (click)="save()">Save</button>
    </div>
  </div>

</div>
