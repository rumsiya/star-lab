<app-navbar></app-navbar>
<app-add-test [editTestInput]="editTestInput"></app-add-test>
<table mat-table class="mat-elavation-z8 w-full p-2 ml-3" [dataSource]="dataSource">
  <ng-container matColumnDef="no">
    <th mat-header-cell *matHeaderCellDef>No.</th>
    <td mat-cell *matCellDef="let row;let i=index">{{ i+1 }}</td>
  </ng-container>
  <ng-container matColumnDef="test_name">
    <th mat-header-cell *matHeaderCellDef>Test Name</th>
    <td mat-cell *matCellDef="let row">{{ row.test_name }}</td>
  </ng-container>
  <ng-container matColumnDef="normal_min">
    <th mat-header-cell *matHeaderCellDef>Normal min</th>
    <td mat-cell *matCellDef="let row">{{ row.normal_min }}</td>
  </ng-container>
  <ng-container matColumnDef="normal_max">
    <th mat-header-cell *matHeaderCellDef>Normal max</th>
    <td mat-cell *matCellDef="let row">{{ row.normal_max }}</td>
  </ng-container>
  <ng-container matColumnDef="unit">
    <th mat-header-cell *matHeaderCellDef>Unit</th>
    <td mat-cell *matCellDef="let row">{{ row.get_unit?row.get_unit.unit_name:"" }}</td>
  </ng-container>
  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef>Price</th>
    <td mat-cell *matCellDef="let row">{{ row.price }}</td>
  </ng-container>
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let row">{{ row.description }}</td>
  </ng-container>
  <ng-conatiner matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let row;let i=index" class="space-x-2">
      <a (click)="showTest(row)" class="cursor-pointer"><i class="fa fa-eye text-green-700"></i></a>
      <a (click)="editTest(row)" class="cursor-pointer"><i class="fa fa-pencil text-blue-600"></i></a>
      <a (click)="deleteTest(row)" class="cursor-pointer"><i class="fa fa-trash text-red-700"></i></a>

    </td>

  </ng-conatiner>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row;columns:displayedColumns"></tr>

</table>
