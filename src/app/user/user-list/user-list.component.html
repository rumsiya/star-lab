<app-navbar></app-navbar>
<app-add-user></app-add-user>
<table mat-table [dataSource]="dataSource" class="mat-elavation-z8 w-full">
  <ng-conatiner matColumnDef="no">
    <th mat-header-cell *matHeaderCellDef>No</th>
    <td mat-cell *matCellDef="let row;let i=index">{{ i+1 }}</td>

  </ng-conatiner>
   <ng-conatiner matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let row;let i=index">{{ row.username }}</td>

  </ng-conatiner>
  <ng-conatiner matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let row;let i=index">{{ row.email }}</td>

  </ng-conatiner>
   <ng-conatiner matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Role</th>
    <td mat-cell *matCellDef="let row;let i=index">{{ row.get_role?row.get_role.role_name:'Patient' }}</td>

  </ng-conatiner>
   <ng-conatiner matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Phone</th>
    <td mat-cell *matCellDef="let row;let i=index">{{ row.phone }}</td>

  </ng-conatiner>
   <ng-conatiner matColumnDef="age">
    <th mat-header-cell *matHeaderCellDef>Age</th>
    <td mat-cell *matCellDef="let row;let i=index">{{ row.age }}</td>

  </ng-conatiner>
   <ng-conatiner matColumnDef="gender">
    <th mat-header-cell *matHeaderCellDef>Gender</th>
    <td mat-cell *matCellDef="let row;let i=index">{{ row.gender ==0?'M':'F' }}</td>

  </ng-conatiner>
  <ng-conatiner matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let row;let i=index" class="space-x-2">
      <a (click)="showUser(row)" class="cursor-pointer"><i class="fa fa-eye text-green-700"></i></a>
      <a (click)="editUser(row)" class="cursor-pointer"><i class="fa fa-pencil text-blue-600"></i></a>
      <a (click)="deleteUser(row)" class="cursor-pointer"><i class="fa fa-trash text-red-700"></i></a>

    </td>

  </ng-conatiner>

  <tr mat-header-row *matHeaderRowDef="displayedColums"></tr>
  <tr mat-row *matRowDef="let row;columns:displayedColums"></tr>

</table>
